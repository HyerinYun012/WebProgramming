spring.application.name=siheung-ai-notice

# 서버 포트 설정
server.port=8080

# 1. MySQL 데이터베이스 연결 설정
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/siheung_ai_notice?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=1234

# 2. JPA 설정 (테이블 자동 매핑 및 실행되는 SQL 로그 보기)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 3. 경기공공데이터 OpenAPI 설정 (명세서 요청주소 반영)
gg.api.url=https://openapi.gg.go.kr/PublServcList
gg.api.key=635b86e8a6e146519a435b7fc317ed6a

# 4. Google Gemini AI API 설정 (키가 아직 없으면 NONE 유지 -> 스마트 키워드 분류기 자동 작동!)
gemini.api.key=NONE