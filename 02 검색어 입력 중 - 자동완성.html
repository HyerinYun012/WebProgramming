<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>02 검색어 입력 중 | 시흥쏙쏙</title>
<link rel="stylesheet" href="assets/styles.css"><script src="assets/app.js"></script>
<style>.dim{position:absolute;inset:80px 0 0 0;background:rgba(15,27,61,.28);z-index:3}.hero{z-index:4;overflow:visible}.hero .search{z-index:6}</style></head>
<body><div class="page" id="root" data-screen-label="02 검색어 입력 중"></div>
<script>
const I=SI,C=SC;
root.innerHTML=`
${C.header(-1)}
<section class="hero tall">${C.heroDeco()}
 <div class="hero-inner">
  <h1><em>시흥시</em>의 다양한 공공사업과 소식을 찾아보세요.</h1>
  <p class="sub">시민을 위한 지원사업, 문화행사, 교육프로그램 등 유용한 정보를 한 번에 검색할 수 있습니다.</p>
  <div class="search">${C.searchBox('청년',{caret:true})}
   <div class="ac">
    <div class="ac-sec">
     <div class="ac-title">추천 검색어</div>
     ${[['청년',' 월세 지원','12건',1],['청년',' 취업역량 강화 프로그램','8건',0],['청년',' 문화 프로그램','6건',0],['청년',' 창업 지원사업','5건',0],['시흥시 ','청년','센터 행사','4건',0]].map(r=>{const [a,b,c,d]=r.length===5?[r[0]+'<mark>'+r[1]+'</mark>'+r[2],'',r[3],r[4]]:['<mark>'+r[0]+'</mark>'+r[1],'',r[2],r[3]];return `<div class="ac-row ${d?'on':''}"><span style="color:var(--g-400)">${I.search.replace(/24/g,'18')}</span><span>${a}</span><span class="meta">${c}</span></div>`}).join('')}
    </div>
    <div class="ac-sec">
     <div class="ac-title">바로가기 공고</div>
     <div class="ac-row">${C.status('closing')}<span>시흥시 <mark>청년</mark> 월세 한시 특별지원</span><span class="meta">D-1</span></div>
     <div class="ac-row">${C.status('open')}<span>시흥시 <mark>청년</mark> 문화 프로그램 참여자 모집</span><span class="meta">D-6</span></div>
    </div>
    <div class="ac-sec" style="display:flex;justify-content:space-between;align-items:center;padding-top:12px;padding-bottom:12px;background:var(--g-50)">
     <span style="font-size:13px;color:var(--g-500)">↑↓ 키로 이동 · Enter로 검색</span><span style="font-size:13px;color:var(--g-500)">자동완성 끄기</span>
    </div>
   </div>
  </div>
  <div class="hot-keywords" style="visibility:hidden"><span class="kw">#</span></div>
 </div>
</section>
<div class="dim"></div>
${C.filterbar()}
<section class="sec" style="margin-top:64px;height:420px"></section>
`;
</script></body></html>
